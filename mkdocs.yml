site_name: BSReadSim
site_description: Bisulfite sequencing read simulation with additional genomics assay support
site_url: https://wbvguo.github.io/BSReadSim/
dev_addr: 127.0.0.1:8700
repo_url: https://github.com/wbvguo/BSReadSim
repo_name: GitHub
docs_dir: docs

theme:
  name: material
  language: en
  logo: img/BSReadSim_header.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - Installation: getting-started/installation.md
  - Quick start: getting-started/quickstart.md
  - Simulation:
      - Workflow: simulation/workflow.md
      - Tutorials: simulation/tutorials.md
      - Customize: simulation/customize.md
      - Other assays: simulation/other-assays.md
  - Outputs: outputs/index.md
  - Reference:
      - CLI reference: reference/cli.md
      - Input formats: reference/formats.md
      - Troubleshoot: help/troubleshoot.md

# Exact contracts and advanced guides stay outside the global navigation.
not_in_nav: |
  /reference/advanced/*.md
