name: Production CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Run Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.16.0"
          python -m ruff check --output-format=github setup.py src tests

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf build-essential cmake zlib1g-dev
          python -m pip install --upgrade pip
          python -m pip install "jsonschema>=4.10" "numpy>=1.24"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  package:
    name: Source distribution and wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf build-essential cmake zlib1g-dev
          python -m pip install --upgrade pip
          python -m pip install build twine "jsonschema>=4.10" "numpy>=1.24"

      - name: Build source distribution and wheel
        run: python -m build

      - name: Validate distribution metadata and contents
        run: |
          python -m twine check --strict dist/*
          python tests/integration/check_distribution_contents.py dist

      - name: Rebuild wheel from the source distribution
        run: |
          mkdir -p "$RUNNER_TEMP/bsreadsim-from-sdist"
          python -m pip wheel --no-deps \
            --wheel-dir "$RUNNER_TEMP/bsreadsim-from-sdist" \
            dist/*.tar.gz

      - name: Test the source-rebuilt wheel outside the checkout
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/bsreadsim-installed"
          "$RUNNER_TEMP/bsreadsim-installed/bin/python" -m pip install --no-deps \
            "$RUNNER_TEMP/bsreadsim-from-sdist"/bsreadsim-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/bsreadsim-installed/bin/python" "$GITHUB_WORKSPACE/tests/integration/check_installed_package.py"
          "$RUNNER_TEMP/bsreadsim-installed/bin/python" "$GITHUB_WORKSPACE/tests/integration/check_installed_cext.py" "$GITHUB_WORKSPACE"
